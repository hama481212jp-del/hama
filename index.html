        })
        .filter((x) => x.score >= 7)
        .sort((a, b) => b.score - a.score);

      if (scored.length) {
        const best = scored[0].score;
        const top = scored.filter((x) => x.score === best);
        return top[Math.floor(Math.random() * top.length)].L;
      }
      // Prefer theme match even if softer on other axes
      const themed = lines.filter((L) => (L.themes || []).includes(theme));
      const pool = themed.length ? themed : lines;
      const loose = pool.filter(
        (L) => L.moods.includes(mood) || L.needs.includes(need) || L.tones.includes(tone)
      );
      if (loose.length) return loose[Math.floor(Math.random() * loose.length)];
      if (themed.length) return themed[Math.floor(Math.random() * themed.length)];
      return fallback[Math.floor(Math.random() * fallback.length)];
    }

    function advanceFromQuestion(q, value) {
      state.answers[q.id] = value;
      state.step += 1;
      if (state.step < questions.length) renderQuestion();
      else renderResult();
    }

    function renderQuestion() {
      updateDots();
      const q = questions[state.step];
      if (q.type === "text") {
        card.innerHTML = `
          <div class="q-label">${q.label}</div>
          <h2 class="q-title">${q.title}</h2>
          <div class="who-field">
            <div class="chips" id="whoChips"></div>
            <input class="who-input" id="whoInput" type="text" maxlength="40"
              placeholder="${q.placeholder}" autocomplete="off" />
            <p class="who-hint">${q.hint || ""}</p>
            <button type="button" class="btn primary" id="whoGo">${q.button}</button>
          </div>
        `;
        const input = document.getElementById("whoInput");
        const chipWrap = document.getElementById("whoChips");
        whoChips.forEach((label) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = label;
          b.onclick = () => {
            input.value = label;
            input.focus();
          };
          chipWrap.appendChild(b);
        });
        const go = () => {
          const v = (input.value || "").trim() || "忖度くん";
          advanceFromQuestion(q, v);
        };
        document.getElementById("whoGo").onclick = go;
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            go();
          }
        });
        setTimeout(() => input.focus(), 50);
        return;
      }
      card.innerHTML = `
        <div class="q-label">${q.label}</div>
        <h2 class="q-title">${q.title}</h2>
        <div class="choices">
          ${q.choices
            .map(
              (c) =>
                `<button type="button" class="choice" data-id="${c.id}">${c.label}</button>`
            )
            .join("")}
        </div>
      `;
      card.querySelectorAll(".choice").forEach((btn) => {
        btn.addEventListener("click", () => {
          advanceFromQuestion(q, btn.dataset.id);
        });
      });
    }

    function renderResult() {
      updateDots();
      const line = pickLine();
      const who = state.answers.who || "忖度くん";
      const spoken = speakAs(who, line.text);
      card.innerHTML = `
        <div class="result">
          <div class="tag">忖度くん · ${escapeHtml(line.vibe || "ひとこと")}</div>
          <p class="from-who">${escapeHtml(who)} の言葉で</p>
          <p class="quote">${escapeHtml(spoken)}</p>
          <p class="meta">選んだ組み合わせと、その人の言いそうな口調でお届けしました。<br />気に入ったら、スクショで保存してみてね。</p>
          <div class="actions">
            <button type="button" class="btn primary" id="again">もう一度ひく</button>
            <button type="button" class="btn ghost" id="same">同じ条件でもう一回</button>
          </div>
        </div>
      `;
      document.getElementById("again").onclick = () => {
        state.step = 0;
        state.answers = {};
        renderQuestion();
      };
      document.getElementById("same").onclick = () => {
        renderResult();
      };
    }

    renderQuestion();
  </script>
</body>
</html>
