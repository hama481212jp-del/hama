  <style>

<body>
  <div class="shell">
    <header>
      <p class="sigil" aria-hidden="true">✦　☾　✦</p>
      <div class="brand" data-brand="channel">ほんここチャンネル</div>
      <h1 data-brand="product">魂のひとこと</h1>
      <p class="lead">直感でひらく、光の導き</p>
      <p class="sub">直感で扉をひらいて。<br />宇宙の静けさから、いまのあなたへ。</p>
    </header>

    <div class="progress" id="progress" aria-hidden="true">
      <div class="dot on" data-i="0"></div>
      <div class="dot" data-i="1"></div>
      <div class="dot" data-i="2"></div>
      <div class="dot" data-i="3"></div>
      <div class="dot" data-i="4"></div>
    </div>

    <main class="card" id="card" aria-live="polite">
      <noscript><p class="q-title">光の言葉を受け取るには、JavaScriptを有効にしてください。</p></noscript>
    </main>

    <p class="foot"><span data-brand="product">魂のひとこと</span> · <span data-brand="channel">ほんここチャンネル</span><br />オリジナルの光の言葉<br />医療の助言でも、確約された予言でもありません。</p>
  </div>

  <script>
    const BRAND = JSON.parse(document.getElementById("brand").textContent);
    const PRODUCT_NAME = BRAND.product;
    const CHANNEL_NAME = BRAND.channel;

    function setMeta(selector, content) {
      const el = document.querySelector(selector);
      if (el) el.setAttribute("content", content);
    }

    function applyBrand() {
      const pageTitle = PRODUCT_NAME + " — " + CHANNEL_NAME;
      const description = PRODUCT_NAME + "。直感で扉をひらくと、宇宙の静けさから、いまの魂へやさしい光の言葉が届きます。";
      const share = PRODUCT_NAME + "。直感で選ぶだけ。守護と高次の静けさから、やさしい導きを受け取ります。";
      document.title = pageTitle;
      setMeta('meta[name="description"]', description);
      setMeta('meta[property="og:title"]', pageTitle);
      setMeta('meta[property="og:description"]', share);
      setMeta('meta[property="og:site_name"]', CHANNEL_NAME);
      setMeta('meta[name="twitter:title"]', pageTitle);
      setMeta('meta[name="twitter:description"]', share);
      setMeta('meta[name="apple-mobile-web-app-title"]', PRODUCT_NAME);
      document.querySelectorAll("[data-brand='product']").forEach((el) => {
        el.textContent = PRODUCT_NAME;
      });
      document.querySelectorAll("[data-brand='channel']").forEach((el) => {
        el.textContent = CHANNEL_NAME;
      });
    }

    const questions = [
      {
        id: "theme",
        label: "光をひらく · 1 / 5",
        title: "いま、どの領域に光を当てますか？",
        choices: [
          { id: "love", label: "愛と絆" },
          { id: "work", label: "使命と豊かさ" },
          { id: "people", label: "人と人の縁" },
          { id: "self", label: "魂の在り方" },
          { id: "daily", label: "日々という聖域" }
        ]
      },
      {
        id: "mood",
        label: "波動を聴く · 2 / 5",
        title: "いまの波動に、いちばん近いのは？",
        choices: [
          { id: "tired", label: "光が、少し薄い" },
          { id: "anxious", label: "波が、ゆれている" },
          { id: "hopeful", label: "光が、差しはじめている" },
          { id: "foggy", label: "霧のなかにいる" }
        ]
      },
      {
        id: "need",
        label: "魂の願い · 3 / 5",
        title: "魂が、いま受け取りたいものは？",
        choices: [
          { id: "ease", label: "やすらぎと守護" },
          { id: "courage", label: "光への一歩" },
          { id: "kindness", label: "許しと慈愛" },
          { id: "reset", label: "波動の整え" }
        ]
      },
      {
        id: "tone",
        label: "響きを選ぶ · 4 / 5",
        title: "どんな響きで、言葉を受け取りますか？",
        choices: [
          { id: "soft", label: "光に包まれるように" },
          { id: "clear", label: "澄んだサインとして" },
          { id: "warm", label: "あたたかな導きで" },
          { id: "light", label: "風のように軽やかに" }
        ]
      },
      {
        id: "who",
        label: "声を迎える · 5 / 5",
        title: "どの存在の声で、受け取りますか？",
        type: "text",
        placeholder: "例）ハイヤーセルフ、ご先祖、お母さん…",
        button: "この声で受け取る",
        hint: "選んだ存在の波動で届きます。下の光をタップしても、そのまま書けます。"
      }
    ];

    const themeVibe = { love: "愛", work: "使命", people: "縁", self: "魂", daily: "暮らし" };
    const needVibe = { ease: "守護", courage: "一歩", kindness: "慈愛", reset: "整え" };

    function pack(soft, clear, warm, light) {
      return { soft: soft, clear: clear, warm: warm, light: light };
    }

    // Original lines only — no third-party oracle text.
    const oracle = {
      love: {
        tired: {
          ease: pack(
            "愛に疲れた夜は、魂が静かな毛布を求めている合図。守護は、がんばるあなたより、ほどけたあなたを抱きしめたがっています。",
            "愛の光が薄いときは、休むことがいちばん深い祈りです。",
            "愛しい人を想って疲れたあなたへ。今夜は宇宙が、あなたの代わりに見守っています。",
            "恋の疲れは、月が雲に隠れて呼吸しているようなもの。羽根を畳んで、空へ預けて。"
          ),
          courage: pack(
            "疲れている愛にも、小さな一歩は残されています。その一歩は、魂がまだ愛を信じている証。",
            "大きな愛の決断は、光が戻ってから。今日は小さな真実だけで十分です。",
            "疲れた胸の奥に、まだ温かい炎がある。その炎のまま、愛の方へ半歩でいい。",
            "愛の勇気は、羽根のように軽くていい。今日は、心をひとつ浮かせるだけで道は開く。"
          ),
          kindness: pack(
            "愛する人の前で消えそうなときは、まず自分の魂を慈しんで。あなたが光を失わないことが、愛の土台です。",
            "愛に疲れた自分を、責めなくていい。慈愛はそこから始まります。",
            "あなたは、もう十分に愛を注いできた。今度は、その慈愛を自分の胸へ還してあげて。",
            "愛の重荷を、今夜は風に置いていい。羽根のような優しさで、自分を撫でるように。"
          ),
          reset: pack(
            "愛の波動が重なったままなら、一度、宇宙の静けさに戻ろう。空白は、愛が新しく息をする場所です。",
            "愛の回路を、いったん静けさで洗い流して。余白のあと、本当の絆が戻ります。",
            "疲れた愛を、あたたかく整えていい。終わりではなく、魂が姿勢を直す時間です。",
            "恋の埃は、風が払ってくれる。窓を開けて、軽い光を部屋に通して。"
          )
        },
        anxious: {
          ease: pack(
            "愛が揺れるとき、宇宙はあなたを急かしていません。守護の光のなかで、呼吸だけを聖域にして。",
            "不安な愛の正体は、未来の霧。いま守るのは、あなたの静かな波動だけ。",
            "揺れる心を、あたたかく抱きしめて。愛は、安心の器にしか、やわらかく注がれません。",
            "恋のざわめきは、潮が引くように過ぎていきます。心を、月の光くらい軽くして。"
          ),
          courage: pack(
            "伝えたい言葉が胸で震えていても、大丈夫。その震えは、魂が真実へ触れようとする光です。",
            "完璧な愛の言葉は要らない。真実の一言が、サインです。",
            "こわいほど大切なんです。その大切さを抱いたまま、愛の方へ声を渡していい。",
            "愛の勇気は、羽音のように小さくていい。ひとこと、風に乗せてみて。"
          ),
          kindness: pack(
            "愛のなかで自分を疑う夜は、魂が許しを待っています。揺れた自分も、光の一部として抱きしめて。",

              out.push({

                tones: [tone],
                text: text,
                vibe: themeVibe[theme] + "の" + needVibe[need]

            });
          });
        });
      });
      return out;

        const sameTone = cell.filter((L) => has(L.tones, answers.tone));
        const pickFrom = sameTone.length ? sameTone : cell;
        if (pickFrom.length) return pickFrom[Math.floor(Math.random() * pickFrom.length)];
      }

      if (scored.length) {
        const best = scored[0].score;
        const top = scored.filter((x) => x.score === best).map((x) => x.L);
        const fresh = excludeText ? top.filter((L) => L.text !== excludeText) : top;
        const pool = fresh.length ? fresh : top;
        return pool[Math.floor(Math.random() * pool.length)];
      }

      const themed = lines.filter((L) => has(L.themes, answers.theme));
      const pool = themed.length ? themed : lines;
      const loose = pool.filter((L) =>
        has(L.moods, answers.mood) || has(L.needs, answers.need) || has(L.tones, answers.tone)
      );
      const pickFrom = loose.length ? loose : (themed.length ? themed : fallback);
      return pickFrom[Math.floor(Math.random() * pickFrom.length)];
    }

    function advanceFromQuestion(q, value) {
      state.answers[q.id] = value;
      state.step += 1;
      if (state.step < questions.length) renderQuestion();
      else renderResult();
    }

    function renderQuestion() {
      clearTimeout(revealTimer);
      updateDots();
      const q = questions[state.step];
      if (q.type === "text") {
        card.innerHTML =
          '<div class="q-label">' + q.label + "</div>" +
          '<h2 class="q-title">' + q.title + "</h2>" +
          '<div class="who-field">' +
            '<div class="chips" id="whoChips"></div>' +
            '<input class="who-input" id="whoInput" type="text" maxlength="40" placeholder="' + q.placeholder + '" autocomplete="off" />' +
            '<p class="who-hint">' + (q.hint || "") + "</p>" +
            '<button type="button" class="btn primary" id="whoGo">' + q.button + "</button>" +
          "</div>";
        const input = document.getElementById("whoInput");
        const chipWrap = document.getElementById("whoChips");
        whoChips.forEach((label) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = label;
          b.onclick = () => {
            input.value = label;
            chipWrap.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === b));
            input.focus();
          };
          chipWrap.appendChild(b);
        });
        input.addEventListener("input", () => {
          chipWrap.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c.textContent === input.value));
        });
        const go = () => {
          const v = (input.value || "").trim() || PRODUCT_NAME;
          advanceFromQuestion(q, v);
        };
        document.getElementById("whoGo").onclick = go;
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            go();
          }
        });
        setTimeout(() => input.focus(), 50);
        return;
      }
      card.innerHTML =
        '<div class="q-label">' + q.label + "</div>" +
        '<h2 class="q-title">' + q.title + "</h2>" +
        '<div class="choices">' +
          q.choices.map((c) => '<button type="button" class="choice" data-id="' + c.id + '">' + c.label + "</button>").join("") +
        "</div>";
      card.querySelectorAll(".choice").forEach((btn) => {
        btn.addEventListener("click", () => advanceFromQuestion(q, btn.dataset.id));
      });
    }

    function showQuote(line, who) {
      const tone = (line.tones && line.tones[0]) || state.answers.tone;
      const spoken = speakAs(who, line.text, tone);
      card.setAttribute("aria-busy", "false");
      card.innerHTML =
        '<div class="result">' +
          '<div class="tag">' + escapeHtml(PRODUCT_NAME) + " · " + escapeHtml(line.vibe || "光") + "</div>" +
          '<p class="from-who">' + escapeHtml(who) + "より</p>" +
          '<p class="quote">' + escapeHtml(spoken) + "</p>" +
          '<p class="meta">あなたの直感が選んだ波動で、言葉が降りてきました。<br />残したい光は、そっと画面に留めて。</p>' +
          '<div class="actions">' +
            '<button type="button" class="btn primary" id="again">もう一度、扉をひらく</button>' +
            '<button type="button" class="btn ghost" id="same">同じ波動で、もうひとつの光</button>' +
          "</div>" +
        "</div>";
      document.getElementById("again").onclick = () => {
        state.step = 0;
        state.answers = {};
        renderQuestion();
      };
      document.getElementById("same").onclick = () => renderResult({ excludeText: line.text, quick: true });
    }

    function renderResult(opts) {
      clearTimeout(revealTimer);
      updateDots();
      const excludeText = opts && opts.excludeText;
      const line = pickLine(excludeText);
      const who = state.answers.who || PRODUCT_NAME;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const wait = reduce ? 0 : (opts && opts.quick ? 700 : 1200);
      const veil = veilLines[Math.floor(Math.random() * veilLines.length)];
      card.setAttribute("aria-busy", "true");
      card.innerHTML =
        '<div class="veil" role="status">' +
          '<div class="orb" aria-hidden="true"></div>' +
          '<p class="veil-text">' + veil + "</p>" +
        "</div>";
      revealTimer = setTimeout(() => showQuote(line, who), wait);
    }

    applyBrand();
    renderQuestion();
  </script>
</body>
</html>
